version: "3.9"

services:
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: agribid_shudh
      POSTGRES_USER: agribid
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agribid -d agribid_shudh"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SERVER_PORT: "8080"
      METRICS_PORT: "9090"
      DATABASE_URL: "postgres://agribid:password@postgres:5432/agribid_shudh?sslmode=disable"
      DB_MAX_OPEN_CONNS: "25"
      DB_MIN_OPEN_CONNS: "5"
      LOG_LEVEL: "info"
      RUN_MIGRATIONS: "true"
      JWT_PRIVATE_KEY_PATH: "/run/secrets/jwt_private"
      JWT_PUBLIC_KEY_PATH: "/run/secrets/jwt_public"
      JWT_ACCESS_TTL_HOURS: "24"
      JWT_REFRESH_TTL_DAYS: "30"
      CORS_ALLOWED_ORIGINS: "http://localhost:3000"
      RATE_LIMIT_AUTH_RPM: "10"
      RATE_LIMIT_API_RPM: "100"
      ENCRYPTION_KEY: "changeme32byteshexencodedkeyhere"
    ports:
      - "8080:8080"
      - "9090:9090"

volumes:
  pgdata:
