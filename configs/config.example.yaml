# ─────────────────────────────────────────────
# Agribid Shudh Backend — Environment Variables
# ─────────────────────────────────────────────
# Copy this file to .env and adjust values.

# App environment: development | staging | production
ENV=development

# Server
SERVER_PORT=8080
METRICS_PORT=9090

# Database
DATABASE_URL=postgres://agribid:password@localhost:5432/agribid_shudh?sslmode=disable
DB_MAX_OPEN_CONNS=25
DB_MIN_OPEN_CONNS=5

# Migrations — set to "true" to auto-run on startup
RUN_MIGRATIONS=true

# JWT (RS256)
JWT_PRIVATE_KEY_PATH=./configs/jwt_private.pem
JWT_PUBLIC_KEY_PATH=./configs/jwt_public.pem
JWT_ACCESS_TTL_HOURS=24
JWT_REFRESH_TTL_DAYS=30

# Logging
LOG_LEVEL=debug

# CORS — comma-separated origins
CORS_ALLOWED_ORIGINS=http://localhost:3000

# Rate limiting
RATE_LIMIT_AUTH_RPM=10
RATE_LIMIT_API_RPM=100

# Encryption — 32-byte key for AES-256
ENCRYPTION_KEY=0123456789abcdef0123456789abcdef

# External integrations (optional, mock defaults)
SMS_PROVIDER=mock
EMAIL_PROVIDER=mock
PAYMENT_GATEWAY=mock
